<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus FGES · version liste</title>
<meta name="description" content="Toutes les formations de la FGES, de l'ISEA et de l'École du Numérique (Université Catholique de Lille) : programmes, débouchés, admission et lieux du campus Vauban.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --cream:#fff8ec; --cream2:#f6ead6; --ink:#2b2233; --ink2:#4f4453; --muted:#6e6270; --bordeaux:#8a2b4e; --navy:#1e305e; --gold:#b9862f; --line:#e3cfae; }
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.55 Nunito,system-ui,sans-serif}
a{color:var(--navy);font-weight:700}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--bordeaux);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;border-radius:8px}
.skip:focus{left:8px}
header{background:var(--bordeaux);color:#fff;padding:28px 20px 24px}
header .in,main{max-width:860px;margin:0 auto}
header p{margin:6px 0 0;opacity:.92}
header a{color:#fff}
h1{font:700 32px/1.1 Fraunces,Georgia,serif;margin:0}
h2{font:700 24px/1.2 Fraunces,Georgia,serif;margin:34px 0 4px}
h2 small{display:block;font:700 14px Nunito,sans-serif;color:var(--muted);margin-top:4px}
main{padding:8px 20px 60px}
.tools{position:sticky;top:0;z-index:2;background:var(--cream);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.tools label{font-weight:800;font-size:14px;display:block;margin-bottom:6px}
.tools input{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:600 16px Nunito,sans-serif;background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:800 14px Nunito,sans-serif;color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--bordeaux);background:#fbe9ef;color:var(--bordeaux)}
.count{margin:10px 0 0;font-weight:700;color:var(--muted)}
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 16px}
summary{cursor:pointer;padding:14px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary b{display:block;font:700 18px/1.3 Fraunces,Georgia,serif}
summary span{display:block;color:var(--muted);font-weight:700;font-size:14px}
summary:after{content:"Afficher le détail ▾";display:inline-block;margin-top:6px;font-size:13px;font-weight:800;color:var(--bordeaux)}
details[open] summary:after{content:"Masquer ▴"}
.det{padding:0 0 16px}
.det h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--bordeaux);margin:12px 0 6px}
.det ul{margin:0;padding-left:20px}
.det li{margin-bottom:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts a{display:inline-block;padding:9px 14px;border-radius:10px;border:2px solid var(--line);text-decoration:none;background:#fff}
.acts a.main{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
.place{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.place h3{margin:0 0 4px;font:700 18px Fraunces,Georgia,serif}
.place p{margin:0 0 6px;color:var(--ink2)}
.place ul{margin:6px 0 0;padding-left:20px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;background:#fff}
footer{max-width:860px;margin:0 auto;padding:20px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<a class="skip" href="#formations">Aller aux formations</a>
<header><div class="in">
	<h1>Campus FGES</h1>
	<p>Toutes les formations de la FGES, de l'ISEA et de l'École du Numérique, et les lieux du campus Vauban.<br>
	<a href="index.html">↩ Revenir au campus en 3D</a></p>
</div></header>
<main>
	<div class="tools" role="search">
		<label for="q">Rechercher une formation</label>
		<input id="q" type="search" placeholder="Data, finance, biologie, alternance…" autocomplete="off">
		<div class="chips" role="group" aria-label="Filtrer par niveau">
			<button data-lv="tout" aria-pressed="true">Tout</button>
			<button data-lv="L" aria-pressed="false">Licences et prépa</button>
			<button data-lv="M" aria-pressed="false">Masters et licence pro</button>
			<button data-lv="DU" aria-pressed="false">Formation continue</button>
		</div>
		<p class="count" id="count" aria-live="polite"></p>
	</div>
	<section id="formations" aria-label="Formations"></section>
	<section aria-labelledby="lieux-t">
		<h2 id="lieux-t">Les lieux du campus</h2>
		<div id="lieux"></div>
	</section>
</main>
<footer>Université Catholique de Lille · FGES. Plan du campus : données © les contributeurs d'<a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.</footer>
<script type="module">
import { FORMATIONS as F, PLACES, LIFE } from "./js/data.js";
import { DETAILS } from "./js/details.js";

const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const norm = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const LV = { tout:["prep","L","LP","M","DU"], L:["prep","L"], M:["LP","M"], DU:["DU"] };
const HAY = Object.fromEntries(F.map(f => { const d = DETAILS[f.id] || {}; return [f.id, norm([f.name, f.pitch, f.school, f.rhythm, (d.p || []).flat().join(" "), d.j || "", d.a || "", d.k || ""].join(" "))]; }));
let lv = "tout", q = "";

function apply(f){
	if(f.level === "prep" || f.level === "L") return `<a class="main" href="https://www.parcoursup.gouv.fr/">Candidater sur Parcoursup</a>`;
	if(f.level === "M") return `<a class="main" href="https://www.monmaster.gouv.fr/">Candidater en M1 sur Mon Master</a>`;
	return "";
}
function card(f){
	const d = DETAILS[f.id] || {};
	return `<details><summary><b>${esc(f.name)}</b><span>${f.school} · ${[f.seats ? f.seats + " places" : null, f.rhythm].filter(Boolean).join(" · ")}</span></summary>
		<div class="det"><p>${esc(f.pitch)}</p>
		${d.p ? `<h3>Au programme</h3><ul>${d.p.map(([k,v]) => `<li><b>${esc(k)} :</b> ${esc(v)}</li>`).join("")}</ul>` : ""}
		${d.j ? `<h3>Et après ?</h3><p>${esc(d.j)}</p>` : ""}
		${d.a ? `<h3>Admission</h3><p>${esc(d.a)}</p>` : ""}
		<div class="acts"><a href="${f.url}">Fiche officielle sur fges.fr</a>${apply(f)}</div></div></details>`;
}
function render(){
	const toks = norm(q).split(/\s+/).filter(Boolean);
	const res = F.filter(f => LV[lv].includes(f.level) && toks.every(t => HAY[f.id].includes(t)));
	document.getElementById("count").textContent = `${res.length} formation${res.length > 1 ? "s" : ""}`;
	const html = ["falise","wenov","ha"].map(p => {
		const list = res.filter(f => f.place === p);
		if(!list.length) return "";
		const P = PLACES[p];
		return `<h2>${esc(P.name)}<small>${esc(P.kicker)}</small></h2>` + list.map(card).join("");
	}).join("");
	document.getElementById("formations").innerHTML = html || `<p class="empty">Aucune formation ne correspond. Essaie un autre mot ou le filtre « Tout ».</p>`;
}
document.getElementById("q").addEventListener("input", e => { q = e.target.value; render(); });
document.querySelectorAll("[data-lv]").forEach(b => b.addEventListener("click", () => {
	lv = b.dataset.lv;
	document.querySelectorAll("[data-lv]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
	render();
}));
render();

const places = [...Object.values(PLACES), ...Object.values(LIFE)];
document.getElementById("lieux").innerHTML = places.map(p => `<div class="place"><h3>${p.icon} ${esc(p.name)}</h3><p><b>${esc(p.kicker)}</b></p><p>${esc(p.text)}</p>
	${p.links && p.links.length ? `<ul>${p.links.map(l => `<li><a href="${l.url}">${esc(l.label)}</a></li>`).join("")}</ul>` : ""}</div>`).join("");
</script>
</body>
</html>
